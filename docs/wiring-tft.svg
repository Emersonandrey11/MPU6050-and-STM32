<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-labelledby="t d">
<title id="t">Wiring: MPU6050 (GY-521) and 2.8 inch ST7789V TFT on an STM32F103 Blue Pill</title>
<desc id="d">TFT on SPI1: SCK PA5, SDI PA7, SDO PA6, CS PA4, DC PA3, RESET PA2, LED PB0, VCC 3.3 V, GND. MPU6050 on I2C1: SCL PB6, SDA PB7, INT PB12, AD0 PB13, XCL PB10, XDA PB11. ST-Link on PA13/PA14.</desc>
