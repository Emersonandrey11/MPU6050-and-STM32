<text x="40" y="690" class="nt">DISPLAY NOTES</text>
<text x="40" y="716" class="note">• SPI1 master, mode 0, 4 MHz (8 MHz PCLK2 ÷ 2), MSB first.</text>
<text x="40" y="738" class="note">• CS, D/C and RESET are plain GPIO push-pull outputs.</text>
<text x="40" y="760" class="note">• BACKLIGHT: TIM3_CH3 PWM at 20 kHz, 50 % by default.</text>
<text x="40" y="782" class="note">• SDO (MISO) is optional: used only to read the panel ID (85 85 52).</text>
<text x="40" y="804" class="note">• LED: most modules switch the backlight with a transistor. If yours</text>
<text x="52" y="826" class="note">has none, connect LED to 3.3 V instead of PB0 (no dimming).</text>
<text x="880" y="690" class="nt">POWER</text>
<text x="880" y="716" class="note">• VCC of both modules to the Blue Pill 3.3 V pin.</text>
<text x="880" y="738" class="note">• Roughly 70–110 mA at full backlight; the default</text>
<text x="892" y="760" class="note">50 % PWM brightness halves the backlight share.</text>
<text x="880" y="782" class="note">• A clone ST-Link's 3.3 V pin can usually supply</text>
<text x="892" y="804" class="note">it; if 3.3 V sags, use USB power.</text>
<text x="880" y="826" class="note">• All grounds are common.</text>
</svg>
