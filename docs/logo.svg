  <!-- gyro ring around Z: front half with arrow -->
  <path d="M49 50 A15 5.5 0 0 0 77.5 52.4" fill="none" stroke="#e6e8eb" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="82.3,48.8 79.1,56.2 74.3,49.8" fill="#e6e8eb"/>
  <circle cx="64" cy="68" r="4.5" fill="#ffffff"/>
