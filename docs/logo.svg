<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">MPU6050 + STM32 bare-metal logo: a chip with three motion axes</title>
  <!-- pins -->
  <g fill="#9aa3ad">
    <rect x="37" y="8" width="6" height="14" rx="1.5"/><rect x="53" y="8" width="6" height="14" rx="1.5"/>
    <rect x="69" y="8" width="6" height="14" rx="1.5"/><rect x="85" y="8" width="6" height="14" rx="1.5"/>
    <rect x="37" y="106" width="6" height="14" rx="1.5"/><rect x="53" y="106" width="6" height="14" rx="1.5"/>
    <rect x="69" y="106" width="6" height="14" rx="1.5"/><rect x="85" y="106" width="6" height="14" rx="1.5"/>
    <rect x="8" y="37" width="14" height="6" rx="1.5"/><rect x="8" y="53" width="14" height="6" rx="1.5"/>
    <rect x="8" y="69" width="14" height="6" rx="1.5"/><rect x="8" y="85" width="14" height="6" rx="1.5"/>
    <rect x="106" y="37" width="14" height="6" rx="1.5"/><rect x="106" y="53" width="14" height="6" rx="1.5"/>
    <rect x="106" y="69" width="14" height="6" rx="1.5"/><rect x="106" y="85" width="14" height="6" rx="1.5"/>
  </g>
  <!-- package -->
  <rect x="18" y="18" width="92" height="92" rx="13" fill="#14233d"/>
  <rect x="21.5" y="21.5" width="85" height="85" rx="10" fill="none" stroke="#2c4878" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="3.2" fill="#3d5c94"/>
  <!-- gyro ring around Z: back half -->
  <path d="M49 50 A15 5.5 0 0 1 79 50" fill="none" stroke="#e6e8eb" stroke-width="2.5" stroke-linecap="round" opacity=".3"/>
  <!-- axes -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="68" x2="64" y2="43" stroke="#4fc9a4"/>
    <line x1="64" y1="68" x2="40.6" y2="81.5" stroke="#f0a24a"/>
